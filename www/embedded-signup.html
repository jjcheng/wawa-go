<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WhatsApp Embedded Signup</title>
  <style>
    :root {
      color-scheme: light;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #17201d;
      background: #eaf3ef;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(680px, 100%); background: #fff; border: 1px solid #cbdcd4; border-radius: 16px; padding: 32px; box-shadow: 0 18px 50px #194b3820; }
    h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: 0; }
    p { color: #52645d; line-height: 1.5; }
    form { display: grid; gap: 16px; margin-top: 24px; }
    label { display: grid; gap: 7px; font-size: 13px; font-weight: 700; color: #31443d; }
    input { width: 100%; border: 1px solid #b9cec4; border-radius: 8px; padding: 12px 13px; font: inherit; }
    input:focus { outline: 3px solid #bde8d2; border-color: #198754; }
    button { margin-top: 8px; border: 0; border-radius: 8px; padding: 13px 16px; color: #fff; background: #087f5b; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { background: #056c4d; }
    button:disabled { cursor: wait; opacity: .6; }
    #status { margin: 24px 0 0; padding: 14px; border-radius: 8px; background: #f2f7f4; white-space: pre-wrap; word-break: break-word; }
    #status.error { color: #9b2c2c; background: #fff1f1; }
    #status.success { color: #17633f; background: #eaf8f0; }
    code { font-size: .92em; }
  </style>
</head>
<body>
  <main>
    <h1>WhatsApp Embedded Signup</h1>
    <p>Enter the Meta app configuration, connect a test business, and send the signup result to the local API.</p>
    <form id="signup-form">
      <label>
        Meta App ID
        <input id="app-id" value="1562286242277440" required autocomplete="off" readonly>
      </label>
      <label>
        Embedded Signup Config ID
        <input id="config-id" value="2193483234557549" required autocomplete="off" readonly>
      </label>
      <label>
        Backend URL
        <input id="api-url" value="http://localhost:9000" required autocomplete="url">
      </label>
      <button id="signup-button" type="submit">Connect WhatsApp</button>
    </form>
    <div id="status" role="status">Ready.</div>
  </main>

  <script>
    let signupData = null;
    let signupCode = null;
    const form = document.getElementById("signup-form");
    const button = document.getElementById("signup-button");
    const statusBox = document.getElementById("status");

    function setStatus(message, kind) {
      statusBox.textContent = message;
      statusBox.className = kind || "";
    }

    function loadFacebookSdk(appId) {
      return new Promise((resolve) => {
        window.fbAsyncInit = function () {
          FB.init({ appId, cookie: true, xfbml: true, version: "v26.0" });
          resolve();
        };
        const script = document.createElement("script");
        script.async = true;
        script.defer = true;
        script.crossOrigin = "anonymous";
        script.src = "https://connect.facebook.net/en_US/sdk.js";
        document.head.appendChild(script);
      });
    }

    function submitSignup(apiUrl) {
      if (!signupData || !signupCode) {
        setStatus("Meta did not return complete signup data.", "error");
        button.disabled = false;
        return;
      }
      setStatus("Saving the WhatsApp signup...");
      fetch(apiUrl.replace(/\/+$/, "") + "/wa/v1/embedded-signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          event: "whatsapp_embedded_signup",
          data: {
            phone_number_id: signupData.phone_number_id,
            waba_id: signupData.waba_id,
            business_id: signupData.business_id,
            code: signupCode
          }
        })
      })
        .then(async (response) => {
          const body = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(body.message || "Backend request failed");
          return body;
        })
        .then((body) => {
          setStatus(JSON.stringify(body, null, 2), "success");
          button.disabled = false;
        })
        .catch((error) => {
          setStatus(error.message, "error");
          button.disabled = false;
        });
    }

    window.addEventListener("message", (event) => {
      if (event.origin !== "https://www.facebook.com" && event.origin !== "https://web.facebook.com") return;
      try {
        const message = typeof event.data === "string" ? JSON.parse(event.data) : event.data;
        if (message.type !== "WA_EMBEDDED_SIGNUP") return;
        if (message.event === "CANCEL") {
          setStatus("Signup cancelled.", "error");
          button.disabled = false;
          return;
        }
        if (message.event === "ERROR") {
          setStatus("Meta signup error: " + (message.data?.error_message || "unknown error"), "error");
          button.disabled = false;
          return;
        }
        if (message.event === "FINISH") {
          signupData = {
            phone_number_id: message.data?.phone_number_id,
            waba_id: message.data?.waba_id,
            business_id: message.data?.business_id
          };
          submitSignup(document.getElementById("api-url").value.trim());
        }
      } catch (_) {
        // Ignore unrelated postMessage payloads.
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      signupData = null;
      signupCode = null;
      setStatus("Opening Meta Embedded Signup...");
      const appId = document.getElementById("app-id").value.trim();
      const configId = document.getElementById("config-id").value.trim();
      try {
        await loadFacebookSdk(appId);
        FB.login((response) => {
          if (!response.authResponse) {
            setStatus("Meta login or signup was cancelled.", "error");
            button.disabled = false;
            return;
          }
          signupCode = response.authResponse.code;
          if (signupData) submitSignup(document.getElementById("api-url").value.trim());
          else setStatus("Complete the signup in Meta...");
        }, {
          config_id: configId,
          response_type: "code",
          override_default_response_type: true,
          extras: {
            feature: "whatsapp_embedded_signup",
            sessionInfoVersion: 3,
            version: "v4"
          }
        });
      } catch (error) {
        setStatus(error.message, "error");
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
